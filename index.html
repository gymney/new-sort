<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rank It Out</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12141a;
    --surface: #1b1e26;
    --surface-2: #232732;
    --line: #2e333e;
    --text: #e9ebf0;
    --text-dim: #8b909c;
    --amber: #ffb020;
    --amber-dim: #7a5a1f;
    --loss: #4a4f5a;
    --danger: #ff6b6b;
    --good: #5fd68a;
    --radius: 10px;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
  }
  .app{ max-width: 720px; margin: 0 auto; padding: 32px 20px 80px; }
  .mono{ font-family: 'JetBrains Mono', monospace; }
  h1,h2,h3{ margin: 0; font-weight: 700; letter-spacing: -0.01em; }
  .eyebrow{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--amber);
    margin-bottom: 6px;
  }
  .top{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom: 28px; }
  .back{
    background:none; border:none; color: var(--text-dim); cursor:pointer;
    font-family: 'JetBrains Mono', monospace; font-size: 13px; padding: 6px 0;
  }
  .back:hover{ color: var(--text); }

  .round-strip{ display:flex; gap:6px; margin-bottom: 14px; flex-wrap: wrap; }
  .round-tab{
    font-family:'JetBrains Mono', monospace; font-size: 12px;
    padding: 5px 10px; border-radius: 4px; background: var(--surface-2);
    color: var(--text-dim); border: 1px solid var(--line);
  }
  .round-tab.current{ color: var(--amber); border-color: var(--amber-dim); background: rgba(255,176,32,0.08); }
  .round-tab.done{ color: var(--text); }

  button.primary{
    background: var(--amber); color: #14100a; border:none; font-weight:700;
    font-family:'Space Grotesk',sans-serif; padding: 13px 22px; border-radius: var(--radius);
    cursor:pointer; font-size:15px; letter-spacing:0.01em;
  }
  button.primary:disabled{ opacity:0.35; cursor:not-allowed; }
  button.primary:hover:not(:disabled){ filter: brightness(1.08); }
  button.ghost{
    background:none; border:1px solid var(--line); color: var(--text);
    padding: 10px 16px; border-radius: var(--radius); cursor:pointer; font-family:'Space Grotesk',sans-serif; font-size:14px;
  }
  button.ghost:hover{ border-color: var(--text-dim); }
  button.small-ghost{
    background:none; border:1px solid var(--line); color: var(--text-dim);
    padding: 5px 10px; border-radius: 20px; cursor:pointer; font-family:'JetBrains Mono',monospace; font-size:11px;
  }
  button.small-ghost:hover{ border-color: var(--amber-dim); color: var(--amber); }
  button.danger-ghost{
    background:none; border:1px solid var(--line); color: var(--danger);
    padding: 8px 14px; border-radius: var(--radius); cursor:pointer; font-size:13px; font-family:'Space Grotesk',sans-serif;
  }

  .list-card{
    background: var(--surface); border:1px solid var(--line); border-radius: var(--radius);
    padding: 16px 18px; margin-bottom: 10px; display:flex; align-items:center; justify-content:space-between;
    cursor:pointer;
  }
  .list-card:hover{ border-color: var(--amber-dim); }
  .list-card .meta{ color: var(--text-dim); font-size:13px; font-family:'JetBrains Mono',monospace; margin-top:4px; }
  .empty-state{
    color: var(--text-dim); border: 1px dashed var(--line); border-radius: var(--radius);
    padding: 28px; text-align:center; font-size: 14px; margin-bottom: 20px;
  }

  label{ display:block; font-size:13px; color: var(--text-dim); margin-bottom:6px; font-family:'JetBrains Mono',monospace; letter-spacing:0.03em; }
  input[type=text], input[type=number], select, textarea{
    width:100%; background: var(--surface); border:1px solid var(--line); border-radius: var(--radius);
    color: var(--text); padding: 12px 14px; font-family:'Space Grotesk',sans-serif; font-size:15px; margin-bottom:20px;
    resize: vertical;
  }
  input[type=text]:focus, input[type=number]:focus, select:focus, textarea:focus{ outline:none; border-color: var(--amber-dim); }
  textarea{ min-height: 220px; line-height:1.6; }
  .hint{ color: var(--text-dim); font-size: 13px; margin-top:-14px; margin-bottom: 20px; }
  .target-row{ display:flex; gap:14px; }
  .target-row > div{ flex:1; }

  .matchup{
    background: var(--surface); border:1px solid var(--line); border-radius: var(--radius);
    margin-bottom: 12px; overflow:hidden;
  }
  .matchup-row{ display:flex; align-items:stretch; }
  .side{
    flex:1; padding: 18px 16px; cursor:pointer; display:flex; align-items:center; font-size:15px; font-weight:600;
    transition: background 0.12s;
    border-left: 3px solid transparent;
  }
  .side:hover{ background: var(--surface-2); }
  .side.picked{ background: rgba(255,176,32,0.1); border-left-color: var(--amber); }
  .side.faded{ color: var(--text-dim); }
  .vs{
    display:flex; align-items:center; justify-content:center; padding: 0 14px;
    font-family:'JetBrains Mono',monospace; font-size:12px; color: var(--amber-dim); background: var(--surface-2);
  }
  .bye-row{ padding: 14px 16px; color: var(--text-dim); font-size: 14px; font-family:'JetBrains Mono',monospace; }
  .group-heading{
    font-size: 12px; letter-spacing:0.08em; text-transform:uppercase; color: var(--amber);
    margin: 20px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line);
  }
  .group-heading:first-child{ margin-top: 4px; }
  .tag{ font-size: 11px; color: var(--text-dim); margin-left: 8px; font-weight: 400; }
  .rematch-flag{
    font-size:11px; font-family:'JetBrains Mono',monospace; color: var(--text-dim); padding: 6px 16px;
    border-top: 1px solid var(--line); background: rgba(255,176,32,0.03);
  }

  .progress{ font-family:'JetBrains Mono',monospace; font-size:13px; color: var(--text-dim); margin-bottom: 18px; }
  .footer-bar{ margin-top: 24px; display:flex; justify-content:flex-end; gap:10px; }

  table{ width:100%; border-collapse: collapse; margin-top: 6px; }
  th{ text-align:left; font-family:'JetBrains Mono',monospace; font-size:11px; color: var(--text-dim); text-transform:uppercase; letter-spacing:0.06em; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  td{ padding: 10px 10px; border-bottom: 1px solid var(--line); font-size: 14px; }
  td.score{ font-family:'JetBrains Mono',monospace; color: var(--amber); text-align:right; }
  td.rank{ font-family:'JetBrains Mono',monospace; color: var(--text-dim); width: 34px; }

  .banner{
    border: 1px solid var(--amber-dim); background: rgba(255,176,32,0.06); border-radius: var(--radius);
    padding: 16px 18px; margin-bottom: 22px; font-size: 14px;
  }
  .banner.done{ border-color: #3f6b46; background: rgba(80,200,120,0.06); }

  .new-btn-row{ margin-top: 18px; display:flex; justify-content: space-between; align-items:center; }

  /* Priority buckets */
  .bucket{ margin-bottom: 26px; border-radius: var(--radius); overflow:hidden; border:1px solid var(--line); }
  .bucket-head{
    display:flex; align-items:center; justify-content:space-between; padding: 12px 16px;
    background: var(--surface-2); border-left: 4px solid var(--amber);
  }
  .bucket-head .label{ font-weight:700; font-size:15px; }
  .bucket-head .count{ color: var(--text-dim); font-size:12px; font-family:'JetBrains Mono',monospace; margin-left:8px; }
  .bucket-body{ background: var(--surface); }
  .bucket-row{
    display:flex; align-items:center; justify-content:space-between;
    padding: 12px 16px; border-top: 1px solid var(--line); font-size: 14px;
  }
  .bucket-row .item-name{ display:flex; align-items:center; gap:8px; }
  .crown{ font-size: 14px; }
  .winpct{ font-family:'JetBrains Mono',monospace; font-size: 12px; color: var(--text-dim); }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
// ---------- storage helpers ----------
async function storageGet(key){
  try{ const r = await window.storage.get(key); return r ? JSON.parse(r.value) : null; }
  catch(e){ return null; }
}
async function storageSet(key, value){
  try{ await window.storage.set(key, JSON.stringify(value)); }
  catch(e){ console.error('storage set failed', e); }
}
async function storageDelete(key){
  try{ await window.storage.delete(key); }catch(e){}
}
async function storageListKeys(prefix){
  try{ const r = await window.storage.list(prefix); return r ? r.keys : []; }
  catch(e){ return []; }
}

function slugify(s){
  return s.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || ('list-'+Date.now());
}
function uid(){ return Math.random().toString(36).slice(2,9); }
function pairKey(a,b){ return [a,b].sort().join('|'); }

let route = { screen: 'home' };
let currentList = null;

async function saveCurrentList(){
  if(currentList) await storageSet('bracket:'+currentList.slug, currentList);
}

function itemName(list, id){
  const it = list.items.find(x=>x.id===id);
  return it ? it.name : '(unknown)';
}

// ---------- recommended round count ----------
// enough rounds to meaningfully separate items without dragging on:
// ceil(log2(n)), floored at 3 so tiny lists still get a fair look.
function recommendedRounds(n){
  return Math.max(3, Math.ceil(Math.log2(Math.max(n,2))));
}

// ============================================================
// PHASE 1 — FIXED-ROUND SWISS. Every item plays exactly
// list.totalRounds rounds. Nobody is eliminated — this just
// generates a win record for everybody to sort by.
// ============================================================
function computeScores(list){
  const scores = {};
  list.items.forEach(it => scores[it.id] = 0);
  list.matches.forEach(m => { if(m.winner) scores[m.winner] = (scores[m.winner]||0) + 1; });
  return scores;
}
function opponentSet(list, itemId){
  const s = new Set();
  list.matches.forEach(m => {
    if(m.a === itemId && m.b) s.add(m.b);
    if(m.b === itemId && m.a) s.add(m.a);
  });
  return s;
}
function playedPairSet(list){
  const s = new Set();
  list.matches.forEach(m => { if(m.a && m.b) s.add(pairKey(m.a,m.b)); });
  return s;
}
function gamesPlayedOf(list, id){
  return list.matches.filter(m => m.a === id || m.b === id).length;
}
function recordOf(list, itemId, scores){
  const played = gamesPlayedOf(list, itemId);
  const w = scores[itemId];
  return { w, l: played - w };
}
function buchholzOf(list, itemId, scores){
  let total = 0;
  opponentSet(list, itemId).forEach(oppId => total += scores[oppId]);
  return total;
}

// ============================================================
// RATING ENGINE — Glicko-lite. Every item carries a rating (mu)
// and an uncertainty (rd, "rating deviation"). Every match
// shrinks both players' rd and nudges mu toward the result.
// Pairing and final ordering both key off mu, not raw win count —
// a single unlucky early loss shrinks your interval a bit but
// never caps where you can end up.
// ============================================================
const GLICKO_Q = Math.log(10) / 400;
function glickoG(rd){ return 1 / Math.sqrt(1 + (3*GLICKO_Q*GLICKO_Q*rd*rd) / (Math.PI*Math.PI)); }
function glickoE(mu, oppMu, oppRd){ return 1 / (1 + Math.pow(10, -glickoG(oppRd) * (mu - oppMu) / 400)); }
function glickoUpdate(mu, rd, oppMu, oppRd, score){
  const gOpp = glickoG(oppRd);
  let e = glickoE(mu, oppMu, oppRd);
  e = Math.min(0.99, Math.max(0.01, e)); // avoid div-by-zero at extreme rating gaps
  const d2 = 1 / (GLICKO_Q*GLICKO_Q * gOpp*gOpp * e * (1-e));
  const newMu = mu + (GLICKO_Q / (1/(rd*rd) + 1/d2)) * gOpp * (score - e);
  const newRd = Math.max(30, Math.sqrt(1 / (1/(rd*rd) + 1/d2))); // floor so rd never hits 0
  return { mu: newMu, rd: newRd };
}
function applyGlickoMatch(list, aId, bId, winnerId){
  const A = list.items.find(x => x.id === aId);
  const B = list.items.find(x => x.id === bId);
  const preA = { mu: A.mu, rd: A.rd }, preB = { mu: B.mu, rd: B.rd };
  const aScore = winnerId === aId ? 1 : 0;
  const ra = glickoUpdate(preA.mu, preA.rd, preB.mu, preB.rd, aScore);
  const rb = glickoUpdate(preB.mu, preB.rd, preA.mu, preA.rd, 1 - aScore);
  A.mu = ra.mu; A.rd = ra.rd;
  B.mu = rb.mu; B.rd = rb.rd;
}
function sortedByRating(list){
  return list.items.slice().sort((a,b) => b.mu - a.mu || a.name.localeCompare(b.name));
}
function ciOverlap(hi, lo){ // hi has higher/equal mu than lo
  return (hi.mu - 2*hi.rd) < (lo.mu + 2*lo.rd);
}
function makePairObj(list, scores, p1, opp, rematch){
  const ra = recordOf(list, p1, scores), rb = recordOf(list, opp, scores);
  return { a: p1, b: opp, decided: null, rematch: !!rematch, wa: ra.w, la: ra.l, wb: rb.w, lb: rb.l };
}

// ============================================================
// PHASE 1 — BASE ROUNDS. Every item plays list.totalRounds
// rounds, paired by nearest current rating (not discrete score
// group) so "like plays like" from the very first mismatch on.
// ============================================================
function generateBasePairings(list){
  const scores = computeScores(list);
  const played = playedPairSet(list);
  const pool = sortedByRating(list).map(it => it.id);
  const used = new Set();
  const pairs = [];

  for(let i=0;i<pool.length;i++){
    const p1 = pool[i];
    if(used.has(p1)) continue;
    let opp = null;
    for(let j=i+1;j<pool.length;j++){
      const p2 = pool[j];
      if(used.has(p2)) continue;
      if(!played.has(pairKey(p1,p2))){ opp = p2; break; }
    }
    if(opp === null){
      for(let j=i+1;j<pool.length;j++){
        const p2 = pool[j];
        if(!used.has(p2)){ opp = p2; break; }
      }
    }
    if(opp !== null){
      used.add(p1); used.add(opp);
      pairs.push(makePairObj(list, scores, p1, opp, played.has(pairKey(p1,opp))));
    }
  }
  const leftover = pool.filter(id => !used.has(id));
  if(leftover.length === 1){
    const id = leftover[0];
    const r = recordOf(list, id, scores);
    pairs.push({ a: id, b: null, decided: id, rematch:false, wa: r.w, la: r.l });
  }

  list.round += 1;
  list.pendingPairs = pairs;
}

// ============================================================
// PHASE 2 — REFINEMENT. Only items whose confidence intervals
// still overlap a neighbor play more, and the eligible window
// shrinks every round toward the top of the list — so effort
// concentrates exactly where the ordering is still ambiguous,
// heaviest at the top, tapering to nothing at the bottom.
// ============================================================
function refinementBudget(roundNum, n){
  return Math.max(4, Math.min(n, Math.ceil(n / Math.pow(2, roundNum))));
}
function generateRefinementPairings(list){
  const scores = computeScores(list);
  const played = playedPairSet(list);
  const sorted = sortedByRating(list);
  const n = sorted.length;
  const budget = refinementBudget(list.refineRound + 1, n);
  const eligible = new Set(sorted.slice(0, budget).map(it => it.id));

  const candSet = new Set();
  for(let i=0;i<n-1;i++){
    const A = sorted[i], B = sorted[i+1];
    if(!eligible.has(A.id) && !eligible.has(B.id)) continue;
    if(ciOverlap(A,B)) candSet.add(pairKey(A.id,B.id));
  }

  if(candSet.size === 0){ list.pendingPairs = []; list.refinementDone = true; return; }

  const used = new Set();
  const pairs = [];
  const idOrder = sorted.map(it => it.id);
  for(let i=0;i<idOrder.length;i++){
    const p1 = idOrder[i];
    if(used.has(p1)) continue;
    let opp = null;
    for(let j=i+1;j<idOrder.length;j++){
      const p2 = idOrder[j];
      if(used.has(p2)) continue;
      if(candSet.has(pairKey(p1,p2)) && !played.has(pairKey(p1,p2))){ opp = p2; break; }
    }
    if(opp === null){
      for(let j=i+1;j<idOrder.length;j++){
        const p2 = idOrder[j];
        if(used.has(p2)) continue;
        if(candSet.has(pairKey(p1,p2))){ opp = p2; break; }
      }
    }
    if(opp !== null){
      used.add(p1); used.add(opp);
      pairs.push(makePairObj(list, scores, p1, opp, played.has(pairKey(p1,opp))));
    }
  }

  if(pairs.length === 0){ list.pendingPairs = []; list.refinementDone = true; return; }
  list.refineRound += 1;
  list.pendingPairs = pairs;
}

async function confirmRound(list){
  const pairs = list.pendingPairs;
  pairs.forEach(pair => {
    list.matches.push({ a: pair.a, b: pair.b, winner: pair.decided });
    if(pair.b !== null) applyGlickoMatch(list, pair.a, pair.b, pair.decided);
  });
  list.pendingPairs = [];
  list.updatedAt = Date.now();

  if(list.phase === 'base'){
    if(list.round >= list.totalRounds){
      list.phase = 'refine';
      list.refineRound = 0;
      list.refinementDone = false;
      generateRefinementPairings(list);
      if(list.refinementDone) finishRanking(list);
    } else {
      generateBasePairings(list);
    }
  } else if(list.phase === 'refine'){
    generateRefinementPairings(list);
    if(list.refinementDone || list.refineRound >= list.maxRefineRounds){
      finishRanking(list);
    }
  }
  await saveCurrentList();
}

function ensurePairings(list){
  if(list.pendingPairs && list.pendingPairs.length > 0) return;
  if(list.phase === 'base') generateBasePairings(list);
  else if(list.phase === 'refine'){
    generateRefinementPairings(list);
    if(list.refinementDone || list.refineRound >= list.maxRefineRounds) finishRanking(list);
  }
}

// ---------- bucket labels / colors ----------
function bucketLabelsFor(k){
  if(k <= 1) return ['Priority'];
  if(k === 2) return ['🔥 Top Priority', '🗄️ Backburner'];
  if(k === 3) return ['🔥 Top Priority', '➖ Medium Priority', '🗄️ Backburner'];
  if(k === 4) return ['🔥 Top Priority', '⭐ High Priority', '🧊 Low Priority', '🗄️ Backburner'];
  if(k === 5) return ['🔥 Top Priority', '⭐ High Priority', '➖ Medium Priority', '🧊 Low Priority', '🗄️ Backburner'];
  const labels = [];
  for(let i=0;i<k;i++){
    if(i===0) labels.push('🔥 Top Priority');
    else if(i===k-1) labels.push('🗄️ Backburner');
    else labels.push(`Tier ${i+1}`);
  }
  return labels;
}
const BUCKET_PALETTE = ['#ffb020','#e2a23f','#c58f52','#a88a68','#8a8378','#6f7581','#565c68','#4a4f5a'];
function bucketColorsFor(k){
  if(k === 1) return [BUCKET_PALETTE[0]];
  const out = [];
  for(let i=0;i<k;i++){
    const idx = Math.round(i * (BUCKET_PALETTE.length-1) / (k-1));
    out.push(BUCKET_PALETTE[idx]);
  }
  return out;
}

function finishRanking(list){
  const sorted = sortedByRating(list);
  const K = Math.max(1, Math.min(list.bucketCount, sorted.length));
  const labels = bucketLabelsFor(K);
  const colors = bucketColorsFor(K);

  let sliceIndices; // sorted ascending list of "cut after this index" positions, length K-1
  if(K <= 1 || sorted.length === K){
    sliceIndices = [];
    const base = Math.floor(sorted.length / K), rem = sorted.length % K;
    let idx = 0;
    for(let i=0;i<K-1;i++){ idx += base + (i < rem ? 1 : 0); sliceIndices.push(idx - 1); }
  } else {
    // Natural-gap bucketing: each cut lands on the biggest nearby rating
    // gap, so boundaries fall where the tournament actually found real
    // separation instead of an arbitrary percentile line — this is what
    // lets buckets be uneven (bigger in the middle) on purpose. But a cut
    // is only allowed to drift so far from its "evenly split" position —
    // unconstrained largest-gap picking collapses onto the few extreme
    // outliers and dumps everyone else into one giant middle bucket, which
    // stops being a useful tier list. The window keeps gap-seeking honest.
    const n = sorted.length;
    const gapSize = i => sorted[i].mu - sorted[i+1].mu;
    const window = Math.max(2, Math.round(n * 0.15));
    sliceIndices = [];
    let floor = 0;
    for(let i=1;i<K;i++){
      const target = Math.round(i * n / K) - 1; // 0-indexed "cut after this index" for an even split
      const lo = Math.max(floor, target - window);
      const hi = Math.min(n - 2, target + window);
      let bestIdx = target, bestSize = -Infinity;
      for(let idx=lo; idx<=hi; idx++){
        const sz = gapSize(idx);
        if(sz > bestSize){ bestSize = sz; bestIdx = idx; }
      }
      bestIdx = Math.max(bestIdx, floor);
      sliceIndices.push(bestIdx);
      floor = bestIdx + 1;
    }
  }

  const buckets = [];
  let start = 0;
  sliceIndices.forEach(cutIdx => {
    buckets.push(sorted.slice(start, cutIdx+1).map(it => it.id));
    start = cutIdx + 1;
  });
  buckets.push(sorted.slice(start).map(it => it.id));

  list.buckets = buckets.map((ids, i) => ({ label: labels[i], color: colors[i], ids }));
  list.bracketChampions = {};
  list.phase = 'bucketed';
  list.updatedAt = Date.now();
}

// ============================================================
// PHASE 2 (optional, per-bucket) — "Force a pick" single elim
// mini-bracket. Doesn't remove anyone from their bucket; just
// crowns one item as the forced #1 choice within that group.
// ============================================================
function seedOrder(n){
  let order = [1,2];
  while(order.length < n){
    const len = order.length * 2;
    const next = [];
    order.forEach(s => { next.push(s); next.push(len + 1 - s); });
    order = next;
  }
  return order;
}
function bracketRoundLabel(n){
  if(n === 2) return 'Final';
  if(n === 4) return 'Semifinals';
  if(n === 8) return 'Quarterfinals';
  return `Round of ${n}`;
}

function startBucketBracket(list, bucketIndex){
  const bucket = list.buckets[bucketIndex];
  if(!bucket || bucket.ids.length < 2) return;
  const seeds = bucket.ids.slice(); // already best-first from finishRanking sort
  let size = 1; while(size < seeds.length) size *= 2;
  const order = seedOrder(size);
  const alive = order.map(seedNum => seedNum <= seeds.length ? seeds[seedNum-1] : null);
  list.activeBracket = { bucketIndex, seeds, alive, outRound: {}, round: 0, champion: null, matches: [], pendingPairs: [] };
  generateBracketRoundPairs(list);
}

function generateBracketRoundPairs(list){
  const ab = list.activeBracket;
  const alive = ab.alive;
  if(alive.length === 1){
    ab.champion = alive[0];
    list.bracketChampions[ab.bucketIndex] = ab.champion;
    return;
  }
  const played = playedPairSet(list);
  const pairs = [];
  for(let i=0;i<alive.length;i+=2){
    const a = alive[i], b = alive[i+1];
    if(a === null){ pairs.push({ a:b, b:null, decided:b, bye:true }); continue; }
    if(b === null){ pairs.push({ a:a, b:null, decided:a, bye:true }); continue; }
    pairs.push({ a, b, decided:null, rematch: played.has(pairKey(a,b)) });
  }
  ab.round += 1;
  ab.pendingPairs = pairs;
}

async function confirmBracketRound(list){
  const ab = list.activeBracket;
  const newAlive = [];
  ab.pendingPairs.forEach(pair => {
    ab.matches.push({ a: pair.a, b: pair.b, winner: pair.decided, round: ab.round });
    if(pair.b !== null){
      const loser = pair.decided === pair.a ? pair.b : pair.a;
      ab.outRound[loser] = ab.round;
    }
    newAlive.push(pair.decided);
  });
  ab.alive = newAlive;
  ab.pendingPairs = [];
  generateBracketRoundPairs(list);
  list.updatedAt = Date.now();
  await saveCurrentList();
}

// ---------- rendering ----------
const app = document.getElementById('app');

function render(){
  if(route.screen === 'home') renderHome();
  else if(route.screen === 'setup') renderSetup();
  else if(route.screen === 'round') renderRound();
  else if(route.screen === 'bracket') renderBracketRound();
  else if(route.screen === 'standings') renderStandings();
}

function statusLabel(list){
  if(list.phase === 'bucketed') return `prioritized · ${list.bucketCount} tiers`;
  if(list.phase === 'refine') return `refining top of list · pass ${list.refineRound} / ${list.maxRefineRounds}`;
  return `base round ${list.round} / ${list.totalRounds}`;
}

async function renderHome(){
  const keys = await storageListKeys('bracket:');
  const lists = [];
  for(const k of keys){
    const d = await storageGet(k);
    if(d) lists.push(d);
  }
  lists.sort((a,b) => (b.updatedAt||0) - (a.updatedAt||0));

  app.innerHTML = `
    <div class="top">
      <div>
        <div class="eyebrow">Priority ranker</div>
        <h1>Rank It Out</h1>
      </div>
    </div>
    <div id="list-container"></div>
    <div class="new-btn-row">
      <button class="primary" id="new-list-btn">+ New list</button>
    </div>
  `;
  const container = document.getElementById('list-container');
  if(lists.length === 0){
    container.innerHTML = `<div class="empty-state">No lists yet. Toss in your to-dos, your Steam sale wishlist, whatever needs sorting.</div>`;
  } else {
    lists.forEach(l => {
      const div = document.createElement('div');
      div.className = 'list-card';
      div.innerHTML = `
        <div>
          <div>${escapeHtml(l.name)}</div>
          <div class="meta">${l.items.length} items · ${statusLabel(l)}</div>
        </div>
        <button class="danger-ghost" data-slug="${l.slug}">Delete</button>
      `;
      div.querySelector('div').onclick = () => openList(l.slug);
      div.querySelector('button').onclick = async (e) => {
        e.stopPropagation();
        if(confirm(`Delete "${l.name}"? This can't be undone.`)){
          await storageDelete('bracket:'+l.slug);
          renderHome();
        }
      };
      container.appendChild(div);
    });
  }
  document.getElementById('new-list-btn').onclick = () => { route = { screen: 'setup' }; render(); };
}

function renderSetup(){
  app.innerHTML = `
    <div class="top">
      <div>
        <div class="eyebrow">New list</div>
        <h1>What are we prioritizing?</h1>
      </div>
      <button class="back" id="back-btn">&larr; Back</button>
    </div>
    <label>List name</label>
    <input type="text" id="list-name" placeholder="Steam Summer Sale 2026" />
    <label>Items — one per line</label>
    <textarea id="list-items" placeholder="Hades II
Balatro
Hollow Knight: Silksong
..."></textarea>
    <div class="hint" id="items-hint">Paste your list. Duplicate lines get ignored. You need at least 3 items.</div>
    <div class="target-row">
      <div>
        <label>Base rounds</label>
        <input type="number" id="rounds-input" min="1" max="15" />
      </div>
      <div>
        <label>Priority tiers</label>
        <select id="bucket-count">
          <option value="3">3 tiers</option>
          <option value="4">4 tiers</option>
          <option value="5" selected>5 tiers</option>
          <option value="6">6 tiers</option>
        </select>
      </div>
    </div>
    <div class="hint" style="margin-top:-14px;">Everyone plays this many base rounds, paired by rating, nobody gets cut. After that, a short automatic refinement phase re-plays only the items whose rankings are still genuinely close — concentrated at the top of the list — until the picture sharpens or a round cap is hit. Recommended round count updates as you type.</div>
    <button class="primary" id="start-btn">Start ranking</button>
  `;
  document.getElementById('back-btn').onclick = () => { route = { screen: 'home' }; render(); };

  const roundsInput = document.getElementById('rounds-input');
  const itemsBox = document.getElementById('list-items');
  const hint = document.getElementById('items-hint');
  let roundsTouched = false;
  roundsInput.addEventListener('input', () => { roundsTouched = true; });

  function updateHint(){
    const raw = itemsBox.value.split('\n').map(s=>s.trim()).filter(Boolean);
    const n = new Set(raw).size;
    const rec = recommendedRounds(Math.max(n,3));
    if(!roundsTouched) roundsInput.value = rec;
    hint.textContent = n >= 3
      ? `${n} items · recommended rounds: ${rec} (enough to meaningfully separate the field without dragging on)`
      : `Paste your list. Duplicate lines get ignored. You need at least 3 items.`;
  }
  itemsBox.addEventListener('input', updateHint);
  updateHint();

  document.getElementById('start-btn').onclick = async () => {
    const name = document.getElementById('list-name').value.trim() || 'Untitled list';
    const raw = itemsBox.value.split('\n').map(s=>s.trim()).filter(Boolean);
    const names = [...new Set(raw)];
    if(names.length < 3){ alert('Add at least 3 items.'); return; }
    const totalRounds = Math.max(1, parseInt(roundsInput.value) || recommendedRounds(names.length));
    const bucketCount = Math.max(1, Math.min(parseInt(document.getElementById('bucket-count').value) || 5, names.length));
    const slug = slugify(name) + '-' + uid();
    const list = {
      slug, name,
      items: names.map(n => ({ id: uid(), name: n, mu: 1500, rd: 350 })),
      totalRounds,
      bucketCount,
      maxRefineRounds: Math.min(6, Math.max(2, Math.ceil(Math.log2(Math.max(names.length,2))))),
      round: 0,
      refineRound: 0,
      refinementDone: false,
      matches: [],
      pendingPairs: [],
      phase: 'base',
      buckets: null,
      bracketChampions: {},
      activeBracket: null,
      updatedAt: Date.now()
    };
    currentList = list;
    generateBasePairings(currentList);
    await saveCurrentList();
    route = { screen: 'round' };
    render();
  };
}

async function openList(slug){
  const l = await storageGet('bracket:'+slug);
  if(!l) return;
  currentList = l;
  if(l.phase === 'bucketed'){
    route = { screen: (l.activeBracket && !l.activeBracket.champion) ? 'bracket' : 'standings' };
  } else if(l.pendingPairs && l.pendingPairs.length > 0){
    route = { screen: 'round' };
  } else {
    ensurePairings(l);
    await saveCurrentList();
    route = { screen: l.phase === 'bucketed' ? 'standings' : 'round' };
  }
  render();
}

function roundStrip(current, total){
  let html = '<div class="round-strip">';
  for(let r=1;r<=total;r++){
    const cls = r === current ? 'current' : (r < current ? 'done' : '');
    html += `<div class="round-tab ${cls}">R${r}</div>`;
  }
  html += '</div>';
  return html;
}

function renderMatchupCard(container, list, pair, idx, opts, onPick){
  const div = document.createElement('div');
  div.className = 'matchup';
  if(pair.b === null){
    div.innerHTML = `<div class="bye-row">${escapeHtml(itemName(list,pair.a))} — bye this round (auto win)</div>`;
  } else {
    const aName = itemName(list, pair.a);
    const bName = itemName(list, pair.b);
    const aPicked = pair.decided === pair.a;
    const bPicked = pair.decided === pair.b;
    const aTag = opts.showRecord ? `${pair.wa}-${pair.la}` : '';
    const bTag = opts.showRecord ? `${pair.wb}-${pair.lb}` : '';
    div.innerHTML = `
      <div class="matchup-row">
        <div class="side ${aPicked?'picked':''} ${bPicked?'faded':''}" data-winner="${pair.a}">${escapeHtml(aName)} ${aTag ? `<span class="tag mono">${aTag}</span>` : ''}</div>
        <div class="vs">VS</div>
        <div class="side ${bPicked?'picked':''} ${aPicked?'faded':''}" data-winner="${pair.b}">${escapeHtml(bName)} ${bTag ? `<span class="tag mono">${bTag}</span>` : ''}</div>
      </div>
      ${pair.rematch ? '<div class="rematch-flag">rematch — these two have played before</div>' : ''}
    `;
    div.querySelectorAll('.side').forEach(el => {
      el.onclick = () => {
        pair.decided = el.getAttribute('data-winner');
        onPick();
      };
    });
  }
  container.appendChild(div);
}

function renderRound(){
  const list = currentList;
  const pairs = list.pendingPairs;
  const decidedCount = pairs.filter(p => p.decided).length;
  const allDecided = decidedCount === pairs.length;
  const isRefine = list.phase === 'refine';

  const headerHtml = isRefine
    ? `<h1>Refining · pass ${list.refineRound} of up to ${list.maxRefineRounds}</h1>`
    : `<h1>Round ${list.round} of ${list.totalRounds}</h1>`;
  const stripOrBanner = isRefine
    ? `<div class="banner">Base rounds are done. These are the items whose rankings are still genuinely close — mostly near the top — getting extra comparisons to sharpen the order. Everyone else is already settled.</div>`
    : roundStrip(list.round, list.totalRounds);

  app.innerHTML = `
    <div class="top">
      <div>
        <div class="eyebrow">${escapeHtml(list.name)}</div>
        ${headerHtml}
      </div>
      <button class="back" id="back-btn">&larr; All lists</button>
    </div>
    ${stripOrBanner}
    <div class="progress">${decidedCount} / ${pairs.length} matchups decided</div>
    <div id="matchups"></div>
    <div class="footer-bar">
      <button class="ghost" id="standings-btn">View live standings</button>
      <button class="primary" id="confirm-btn" ${allDecided ? '' : 'disabled'}>Confirm round &rarr;</button>
    </div>
  `;
  document.getElementById('back-btn').onclick = () => { route = { screen: 'home' }; render(); };
  document.getElementById('standings-btn').onclick = () => { route = { screen: 'standings' }; render(); };

  const container = document.getElementById('matchups');
  const groupKey = (pair) => (pair.b !== null) ? `${pair.wa}-${pair.la}` : `bye-${pair.wa}`;
  const groups = new Map();
  pairs.forEach((pair, idx) => {
    const key = groupKey(pair);
    if(!groups.has(key)){
      const label = pair.b !== null ? `(${pair.wa}-${pair.la}) matchups` : 'bye';
      groups.set(key, { label, indices: [] });
    }
    groups.get(key).indices.push(idx);
  });
  const sortedGroupEntries = [...groups.entries()].sort((x,y) => {
    const px = pairs[x[1].indices[0]], py = pairs[y[1].indices[0]];
    return py.wa - px.wa;
  });
  sortedGroupEntries.forEach(([key, group]) => {
    const heading = document.createElement('div');
    heading.className = 'group-heading mono';
    heading.textContent = group.label;
    container.appendChild(heading);
    group.indices.forEach(idx => {
      renderMatchupCard(container, list, pairs[idx], idx, { showRecord: true }, () => { saveCurrentList(); renderRound(); });
    });
  });

  document.getElementById('confirm-btn').onclick = async () => {
    await confirmRound(list);
    route = { screen: list.phase === 'bucketed' ? 'standings' : 'round' };
    render();
  };
}

function renderBracketRound(){
  const list = currentList;
  const ab = list.activeBracket;
  const bucket = list.buckets[ab.bucketIndex];
  const pairs = ab.pendingPairs;
  const decidedCount = pairs.filter(p => p.decided).length;
  const allDecided = decidedCount === pairs.length;

  app.innerHTML = `
    <div class="top">
      <div>
        <div class="eyebrow">${escapeHtml(list.name)} · forcing a pick from ${escapeHtml(bucket.label.replace(/^\p{Emoji}\s*/u,''))}</div>
        <h1>${bracketRoundLabel(ab.alive.length)}</h1>
      </div>
      <button class="back" id="back-btn">&larr; Standings</button>
    </div>
    <div class="progress">${ab.alive.length} contenders left · ${decidedCount} / ${pairs.length} matchups decided</div>
    <div id="matchups"></div>
    <div class="footer-bar">
      <button class="primary" id="confirm-btn" ${allDecided ? '' : 'disabled'}>Confirm &rarr;</button>
    </div>
  `;
  document.getElementById('back-btn').onclick = () => { route = { screen: 'standings' }; render(); };

  const container = document.getElementById('matchups');
  pairs.forEach((pair, idx) => {
    renderMatchupCard(container, list, pair, idx, { showRecord: false }, () => { saveCurrentList(); renderBracketRound(); });
  });

  document.getElementById('confirm-btn').onclick = async () => {
    await confirmBracketRound(list);
    route = { screen: (list.activeBracket && list.activeBracket.champion) ? 'standings' : 'bracket' };
    render();
  };
}

function stripEmoji(s){ return s.replace(/^[^\w]+/u,'').trim(); }

function renderStandings(){
  const list = currentList;

  if(list.phase === 'bucketed'){
    app.innerHTML = `
      <div class="top">
        <div>
          <div class="eyebrow">${escapeHtml(list.name)}</div>
          <h1>Priority list</h1>
        </div>
        <button class="back" id="back-btn">&larr; All lists</button>
      </div>
      <div class="banner done"><strong>Sorted.</strong> Everything's still on the list — nothing got cut, it's just grouped by how it did over ${list.totalRounds} rounds. Use "Force a pick" on any tier if you want a single forced choice out of it.</div>
      <div id="buckets"></div>
      <div class="footer-bar"></div>
    `;
    document.getElementById('back-btn').onclick = () => { route = { screen: 'home' }; render(); };

    const scores = computeScores(list);
    const container = document.getElementById('buckets');
    list.buckets.forEach((bucket, bIdx) => {
      const wrap = document.createElement('div');
      wrap.className = 'bucket';
      const champion = list.bracketChampions[bIdx];
      wrap.innerHTML = `
        <div class="bucket-head" style="border-left-color:${bucket.color}">
          <div><span class="label" style="color:${bucket.color}">${bucket.label}</span><span class="count">${bucket.ids.length} item${bucket.ids.length===1?'':'s'}</span></div>
          ${bucket.ids.length > 1 ? `<button class="small-ghost" data-bidx="${bIdx}">${champion ? 'Redo pick' : 'Force a pick →'}</button>` : ''}
        </div>
        <div class="bucket-body"></div>
      `;
      const body = wrap.querySelector('.bucket-body');
      bucket.ids.forEach(id => {
        const w = scores[id];
        const played = gamesPlayedOf(list, id);
        const pct = played > 0 ? Math.round((w/played)*100) : 0;
        const row = document.createElement('div');
        row.className = 'bucket-row';
        row.innerHTML = `
          <div class="item-name">${id===champion ? '<span class="crown">👑</span>' : ''}${escapeHtml(itemName(list,id))}</div>
          <div class="winpct">${w}-${played-w} · ${pct}%</div>
        `;
        body.appendChild(row);
      });
      const btn = wrap.querySelector('button[data-bidx]');
      if(btn){
        btn.onclick = async () => {
          startBucketBracket(list, bIdx);
          await saveCurrentList();
          route = { screen: 'bracket' };
          render();
        };
      }
      container.appendChild(wrap);
    });
    return;
  }

  // live standings, base or refinement phase
  const scores = computeScores(list);
  const sorted = sortedByRating(list);
  const isRefine = list.phase === 'refine';
  const banner = isRefine
    ? `Refinement pass ${list.refineRound} of up to ${list.maxRefineRounds}. Only items whose ranges still overlap a neighbor — mostly near the top — keep playing.`
    : `Base round ${list.round} of ${list.totalRounds}. Ranked by rating, not raw win count — a range column shows how settled each spot still is.`;

  app.innerHTML = `
    <div class="top">
      <div>
        <div class="eyebrow">${escapeHtml(list.name)}</div>
        <h1>Live standings</h1>
      </div>
      <button class="back" id="back-btn">&larr; All lists</button>
    </div>
    <div class="banner">${banner}</div>
    <table>
      <thead><tr><th>#</th><th>Item</th><th>Record</th><th>Range</th></tr></thead>
      <tbody id="standings-body"></tbody>
    </table>
    <div class="footer-bar">
      <button class="primary" id="continue-btn">Back to current round &rarr;</button>
    </div>
  `;
  document.getElementById('back-btn').onclick = () => { route = { screen: 'home' }; render(); };
  document.getElementById('continue-btn').onclick = () => { route = { screen: 'round' }; render(); };

  const body = document.getElementById('standings-body');
  sorted.forEach((it, i) => {
    const w = scores[it.id];
    const played = gamesPlayedOf(list, it.id);
    const l = Math.max(played - w, 0);
    const lo = Math.round(it.mu - 2*it.rd), hi = Math.round(it.mu + 2*it.rd);
    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="rank">${i+1}</td><td>${escapeHtml(it.name)}</td><td class="score mono">${w}-${l}</td><td class="score mono">${lo}&ndash;${hi}</td>`;
    body.appendChild(tr);
  });
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
